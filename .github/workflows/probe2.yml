name: Runner probe 2

on:
  workflow_dispatch:

jobs:
  probe-macos-13:
    runs-on: macos-13
    steps:
      - run: sw_vers; uname -m; xcodebuild -version || true
  probe-macos-15-intel:
    runs-on: macos-15-intel
    steps:
      - run: sw_vers; uname -m; xcodebuild -version || true
  probe-macos-14-large:
    runs-on: macos-14-large
    steps:
      - run: sw_vers; uname -m; xcodebuild -version || true
  probe-macos-13-large:
    runs-on: macos-13-large
    steps:
      - run: sw_vers; uname -m; xcodebuild -version || true
