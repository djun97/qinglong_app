name: Runner probe

on:
  workflow_dispatch:

jobs:
  probe-macos-14:
    runs-on: macos-14
    steps:
      - run: uname -a; sw_vers; xcodebuild -version || true
  probe-macos-15:
    runs-on: macos-15
    steps:
      - run: uname -a; sw_vers; xcodebuild -version || true
  probe-macos-latest:
    runs-on: macos-latest
    steps:
      - run: uname -a; sw_vers; xcodebuild -version || true
  probe-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - run: uname -a
